name: Build Android APKs

on:
  push:
    branches: [master]
    paths:
      - 'mobile-app/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Read app version
        id: appver
        run: |
          VERSION=$(grep -m1 '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Get dependencies
        run: flutter pub get

      - name: Build release APKs (split per ABI)
        run: flutter build apk --release --split-per-abi

      - name: Collect and rename APKs
        run: |
          mkdir -p ../apk-out
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk    ../apk-out/karachi-safar-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk  ../apk-out/karachi-safar-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk       ../apk-out/karachi-safar-x86_64.apk
          ls -la ../apk-out

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.appver.outputs.version }}
          name: Karachi Safar v${{ steps.appver.outputs.version }} - Android App
          body: |
            Automatic build from commit ${{ github.sha }}.

            - karachi-safar-arm64-v8a.apk - most modern phones
            - karachi-safar-armeabi-v7a.apk - older phones
            - karachi-safar-x86_64.apk - emulator
          files: apk-out/*.apk
          fail_on_unmatched_files: true
