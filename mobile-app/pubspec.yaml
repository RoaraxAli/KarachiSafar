name: karachi_safar
description: Karachi Safar - Navigate Karachi by public transit. Like Google Maps for buses, routes & location.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  geolocator: ^13.0.2
  permission_handler: ^11.3.1
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  url_launcher: ^6.3.1
  http: ^1.2.2
  shared_preferences: ^2.3.3
  package_info_plus: ^8.1.2
  upgrader: ^11.3.1
  in_app_update: ^4.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
